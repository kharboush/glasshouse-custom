<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight View</title>
<style>
  :root{color-scheme:dark;--bg:#0c0b0a;--panel:#151411;--line:#2a2825;--text:#ece7df;--dim:#a39d93;--accent:#e9ad55}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:32px 16px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:24px;font-weight:600;margin-bottom:4px}
  p.sub{color:var(--dim);margin-bottom:24px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  .row b{display:block;font-weight:600}
  .row span{color:var(--dim);font-size:14px}
  button,select{font:inherit;color:var(--text);background:#211f1b;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
  button.on{background:var(--accent);color:#1a1307;border-color:var(--accent);font-weight:600}
  #status{color:var(--dim);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Spotlight View</h1>
  <p class="sub">For Glasshouse Home on this TV. Changes apply straight away.</p>
  <div class="row">
    <div><b>Spotlight View</b><span>A big live preview up top, with a compact clock in the corner and larger tiles below.</span></div>
    <button id="on" type="button">&mdash;</button>
  </div>
  <div class="row">
    <div><b>Font</b><span>The typeface Home uses while Spotlight View is on.</span></div>
    <select id="font">
      <option value="default">Glasshouse fonts</option>
      <option value="system">System font</option>
      <option value="geist">Geist</option>
      <option value="inter">Inter</option>
    </select>
  </div>
  <p id="status"></p>
</main>
<script>
  var onBtn = document.getElementById('on'), fontSel = document.getElementById('font'), status = document.getElementById('status');
  function show(s) {
    onBtn.textContent = s.on ? 'On' : 'Off';
    onBtn.className = s.on ? 'on' : '';
    fontSel.value = s.font;
  }
  function save(change) {
    status.textContent = 'Saving…';
    fetch('/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(change) })
      .then(function (r) { return r.json(); })
      .then(function (s) { if (!s.ok) throw new Error(s.error); show(s); status.textContent = 'Saved.'; })
      .catch(function (e) { status.textContent = 'Could not save: ' + e.message; });
  }
  onBtn.onclick = function () { save({ on: onBtn.textContent !== 'On' }); };
  fontSel.onchange = function () { save({ font: fontSel.value }); };
  fetch('/settings').then(function (r) { return r.json(); }).then(show)
    .catch(function () { status.textContent = 'Could not reach the TV.'; });
</script>
</body>
</html>
