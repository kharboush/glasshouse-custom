<!doctype html>
<!-- picture-panel @VERSION@ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Panel</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'LG Smart UI',sans-serif;color:#ece7df;-webkit-font-smoothing:antialiased}
#panel{position:absolute;left:32px;bottom:32px;width:640px;background:rgba(0,0,0,.95);
  outline:1px solid rgba(244,241,234,.16);padding-bottom:12px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:space-between;justify-content:space-between;
  height:58px;margin:0 16px 8px;padding:0 8px 0 22px;cursor:default;
  outline:1px solid rgba(244,241,234,.16)}
.row.focus{outline:2px solid #ece7df;background:#141310}
.row.na .lbl,.row.na .val{color:#3a3732}
.row.off .lbl,.row.off .val{color:#6b665e}
.row.focus.off .lbl{color:#a39d93}
.lbl{font-size:21px;color:#a39d93}
.row.more{-webkit-justify-content:center;justify-content:center;padding:0 22px}
.row.more .ctl{display:-webkit-flex;display:flex}
.row.more .lbl{display:none}
.row.more .arrow,.row.more.focus .arrow{width:56px;height:56px;line-height:52px;font-size:44px;color:#ece7df;visibility:visible}
.row.focus .lbl{color:#ece7df}
.ctl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.arrow{width:40px;height:40px;line-height:38px;text-align:center;font-size:24px;color:#3a3732;cursor:pointer}
.row.focus .arrow{color:#ece7df}
.row.na .arrow,.row.off .arrow{visibility:hidden}
.val{min-width:200px;text-align:center;font-size:21px;font-weight:600}
#info{margin:0 16px 4px;padding-top:20px}
#cells{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr}
.cell{box-sizing:border-box;padding:0 8px 14px 6px}
.cell .k{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#6b665e}
.cell .v{font-size:20px;font-weight:600;color:#ece7df;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v.none{color:#3a3732}
#tip{display:none;position:absolute;top:0;left:704px;width:440px;padding:18px 22px;background:rgba(0,0,0,.95);
  outline:1px solid rgba(244,241,234,.16);line-height:1.4}
#tip.show{display:block}
#tip.err{outline-color:#e9ad55}
#tip b{display:block;font-size:22px;font-weight:600;color:#ece7df}
#tip span{display:block;font-size:19px;color:#a39d93;margin-top:4px}
</style>
</head>
<body>
<div id="panel">
  <div id="info"><div id="cells"></div></div>
  <div id="rows"></div>
</div>
<div id="tip"><b id="tipT"></b><span id="tipX"></span></div>
<script>
/*
 * The Picture Panel, served by Glasshouse so its requests are same-origin with the
 * API (POST /api/control refuses other origins). Reads the TV's own values and
 * choices from /api/lgsettings and sends changes through /api/control, the way
 * Glasshouse's dashboard does. ES5 only.
 */
(function () {
  var DEFS = [
    { id: 'pictureMode', label: 'Picture Mode', kind: 'choice', core: true },
    { id: 'gameGenre', label: 'Game Genre', kind: 'choice', hide: true, gameOnly: true },
    { id: 'backlight', label: 'OLED Pixel Brightness', kind: 'range', core: true },
    { id: 'blackLevel', label: 'Black Level', kind: 'choice', names: { auto: 'Auto', low: 'Low', high: 'High' },
      missing: 'Not on this input' },
    { id: 'dynamicContrast', label: 'Auto Dynamic Contrast', kind: 'choice' },
    { id: 'peakBrightness', label: 'Peak Brightness', kind: 'choice' },
    { id: 'hdrDynamicToneMapping', label: 'Dynamic Tone Mapping', kind: 'choice', hide: true },
    { id: 'colorTemperature', label: 'Color Temperature', kind: 'temp', core: true },
    { id: 'truMotionMode', label: 'TruMotion', kind: 'choice', core: true },
    { id: 'allSettings', label: 'All Settings', kind: 'link', action: 'settings' },
    { id: 'more', label: 'See more', kind: 'link', action: 'more', always: true }
  ];
  var CELLS = [
    { id: 'res', label: 'Resolution' }, { id: 'hz', label: 'Refresh rate' }, { id: 'fps', label: 'FPS' }, { id: 'vrr', label: 'VRR' },
    { id: 'hdr', label: 'Dynamic range' }, { id: 'allm', label: 'Low latency' }, { id: 'color', label: 'Color' }, { id: 'bits', label: 'Bit depth' },
    { id: 'hdmi', label: 'HDMI' }, { id: 'speed', label: 'Speed' }, { id: 'audio', label: 'Audio' }, { id: 'out', label: 'Audio output' }
  ];
  var cellEls = {}, sig = null, now = null, fps = null, aud = null;
  var sel = 0, idleTimer = null, loaded = false, shown = false, expanded = false;
  var rowsEl = document.getElementById('rows');
  var tipEl = document.getElementById('tip'), tipT = document.getElementById('tipT'), tipX = document.getElementById('tipX');
  var els = [], pending = {};

  function http(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 12000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
      cb(x.status >= 200 && x.status < 300 ? r : null, r);
    };
    x.ontimeout = function () { cb(null, null); };
    x.send(body ? JSON.stringify(body) : null);
  }

  // Messages and hints show in their own box, a title over a line of detail, directly to the
  // right of the panel and level with its top, wherever the panel ends up.
  function say(title, text, bad) {
    if (!title) { tipEl.className = ''; return; }
    var r = document.getElementById('panel').getBoundingClientRect();
    tipEl.style.top = r.top + 'px';
    tipEl.style.left = (r.right + 16) + 'px';
    tipT.textContent = title;
    tipX.textContent = text || '';
    tipEl.className = bad ? 'show err' : 'show';
  }

  function choiceAt(c) {
    var ch = c.row.choices || [], i;
    for (i = 0; i < ch.length; i++) if (ch[i].value === c.row.value) return i;
    return -1;
  }
  function text(c) {
    if (c.def.kind === 'link') return '';
    if (!loaded && !shown) return '\u2014';       // until the TV has answered
    if (!c.row) return c.def.missing || 'Not available';
    if (c.def.kind === 'range') return String(c.row.value);
    if (c.def.kind === 'temp') {
      var v = c.row.value;
      return v === 0 ? 'Neutral' : (v < 0 ? 'Warm ' + (-v) : 'Cool ' + v);
    }
    var i = choiceAt(c);
    if (i < 0) return String(c.row.value);
    var ch = c.row.choices[i];
    return (c.def.names && c.def.names[ch.value]) || ch.label || String(ch.value);
  }
  function paint(i) {
    var c = ctl[i], e = els[i];
    var cls = 'row' + (c.def.action === 'more' ? ' more' : '') + (i === sel ? ' focus' : '');
    if (c.def.kind !== 'link') cls += !c.row ? ' na' : (c.row.active === false ? ' off' : '');
    e.row.className = cls;
    e.row.style.display = visible(i) ? '' : 'none';
    if (c.def.action === 'more') { e.lbl.textContent = ''; e.arrow.style.webkitTransform = e.arrow.style.transform = expanded ? 'rotate(-90deg)' : 'rotate(90deg)'; }
    e.val.textContent = text(c);
  }
  function paintAll() { for (var i = 0; i < ctl.length; i++) paint(i); }

  // A row marked hide is left out when the TV does not offer it here; Game Genre also only
  // shows in a game picture mode (game, HDR game, Dolby Vision game).
  function isGameMode() { return !!(ctl[0].row && /game/i.test(String(ctl[0].row.value))); }
  function visible(i) {
    var c = ctl[i];
    if (!expanded && !c.def.core && !c.def.always) return false;
    if (c.def.hide && !c.row) return false;
    if (c.def.gameOnly && !isGameMode()) return false;
    return true;
  }
  // Moves the selection to the next shown row, wrapping at either end.
  function step(dir) {
    var n = ctl.length, i = sel, k;
    for (k = 0; k < n; k++) {
      i = (i + dir + n) % n;
      if (visible(i)) { sel = i; return; }
    }
  }

  // ---- the signal block: read only, refreshed while the panel is open
  var HDR = { hdr10: 'HDR10', hdr10plus: 'HDR10+', dolby_vision: 'Dolby Vision', hlg: 'HLG', sdr: 'SDR' };
  function num(n) { return String(Math.round(n * 100) / 100); }
  function vrrName(t) {
    var k = String(t || '').toLowerCase().replace(/[^a-z]/g, '');
    if (!k || k === 'off' || k === 'fixed') return '';
    if (k === 'gsync') return 'G-SYNC';
    if (k === 'freesync') return 'FreeSync';
    if (k === 'hdmi' || k === 'hdmivrr' || k === 'vrr') return 'HDMI VRR';
    return String(t);
  }
  // Audio: what the TV is receiving, from Glasshouse's live reading. Atmos-type content is
  // named as such; otherwise the codec.
  var AUDIO = { pcm: 'PCM', ac3: 'Dolby Digital', eac3: 'Dolby Digital+', mat: 'Dolby TrueHD', truehd: 'Dolby TrueHD', dts: 'DTS', dtshd: 'DTS-HD' };
  function immersiveName(i) {
    if (i && typeof i === 'object') { if (i.display) return String(i.display); i = i.label || ''; }
    var k = String(i || '').toLowerCase().replace(/[^a-z]/g, '');
    if (!k) return '';
    if (k.indexOf('atmos') !== -1) return 'Dolby Atmos';
    if (k === 'dtsx') return 'DTS:X';
    return String(i);
  }
  function audioText() {
    var inp = aud && aud.live && aud.live.input;
    if (!inp || !inp.codec) return null;
    if (/^\(?(null|none|off|unknown)\)?$/i.test(String(inp.codec))) return stats && /^com\.webos\.app\.hdmi\d$/.test(String(stats.app_id || '')) ? 'None' : null;
    var im = immersiveName(inp.immersive);
    if (/^(none|off)$/i.test(im)) im = '';
    return im || AUDIO[String(inp.codec).toLowerCase()] || String(inp.codec);
  }
  var sigDone = false, audDone = false, statsDone = false, lastInfo = null, stats = null, link = null;
  // The HDMI link of the input on screen, from the TV's own stats: FRL is HDMI 2.1, TMDS at 6 Gbps is 2.0, lower is 1.4.
  function linkOf(st, port) {
    var l = null;
    ((st && st.hdmi_links) || []).forEach(function (x) { if (x.input === port) l = x; });
    if (!l || !l.phy_mode) return null;
    var m = /^FRL\s+(\d+)G\s+(\d)L/i.exec(l.phy_mode), n = /^FRL\s+(\d+)\s*Gbps/i.exec(l.phy_mode), t = /^(\d+)G/.exec(l.phy_mode);
    if (m) return { ver: '2.1', speed: (m[1] * m[2]) + ' Gbps' };
    if (n) return { ver: '2.1', speed: n[1] + ' Gbps' };
    if (t) return { ver: Number(t[1]) >= 6 ? '2.0' : '1.4', speed: t[1] + ' Gbps' };
    return null;
  }
  // Where the sound goes, from the TV's output setting. Over eARC/ARC it is the soundbar's name when Glasshouse
  // has found one; the receiver is not named for any other output, since it may be connected but unused.
  var OUTS = { tv_speaker: 'TV Speaker', external_optical: 'Optical', tv_external_speaker: 'TV + Optical',
    external_arc: 'HDMI ARC', bt_soundbar: 'Bluetooth', tv_speaker_bluetooth: 'TV + Bluetooth',
    mobile_phone: 'Mobile Phone', flex_connector: 'Flex Connector' };
  function outName() {
    var snd = stats && stats.sound;
    if (!snd || !snd.output_raw) return null;
    var r = aud && aud.receiver;
    if (snd.output_raw === 'external_arc' && r && r.connected && r.name) return String(r.name);
    return OUTS[snd.output_raw] || String(snd.output || snd.output_raw);
  }
  try { lastInfo = JSON.parse(localStorage.getItem('picture-panel-info') || 'null'); } catch (e) { lastInfo = null; }
  function paintInfo() {
    // What is on screen comes from the TV's own foreground app: Glasshouse's "now" keeps naming the last
    // input after leaving it. Off an HDMI input there is no signal to describe.
    var hm = stats && /^com\.webos\.app\.hdmi(\d)$/.exec(String(stats.app_id || ''));
    var offInput = !!stats && !hm;
    var s = sig, t = fps && !offInput ? vrrName(fps.vrrType) : '';
    link = hm && stats.signal_timing ? linkOf(stats, Number(hm[1])) : null;
    var v = {
      res: s && s.width ? s.width + '\u00d7' + s.height : null,
      hz: s && s.hz ? num(s.hz) + ' Hz' : null,
      vrr: s ? (t || (s.vrr ? 'On' : 'Off')) : null,
      hdr: s ? (HDR[s.hdr] || (s.hdr ? String(s.hdr).toUpperCase() : 'SDR')) : null,
      allm: s ? (s.allm ? 'On' : 'Off') : null,
      color: s && s.chroma ? s.chroma : null,
      bits: s && s.bits ? s.bits + '-bit' : null,
      audio: audioText(),
      fps: fps && !offInput && fps.frameRate ? String(Math.round(fps.frameRate)) : null,
      hdmi: link ? link.ver : null,
      speed: link ? link.speed : null,
      out: outName()
    };
    // Until the TV has answered for the signal and the audio, the last readings stand in for dashes.
    var fresh = sigDone && audDone && statsDone;
    if (fresh) { try { localStorage.setItem('picture-panel-info', JSON.stringify(v)); } catch (e) { /* not kept */ } }
    else if (lastInfo) { for (var key in v) if (v[key] === null && lastInfo[key] != null) v[key] = lastInfo[key]; }
    CELLS.forEach(function (c) {
      var el = cellEls[c.id];
      el.textContent = v[c.id] === null ? '\u2014' : v[c.id];
      el.className = 'v' + (v[c.id] === null ? ' none' : '');
    });
  }
  function loadInfo() {
    loadFps();
    http('GET', '/api/audio?t=' + Date.now(), null, function (r) { aud = r && r.ok ? r : null; audDone = true; paintInfo(); });
    // What is on screen is the TV's own foreground app (Glasshouse's "now" keeps the last input after leaving it).
    // Its picture is read the same way for an input or an app: Home gives its 1080p SDR, for example.
    http('GET', '/api/stats?t=' + Date.now(), null, function (r) {
      stats = r && r.ok ? r : null;
      statsDone = true;
      var id = stats ? String(stats.app_id || '') : '', m = /^com\.webos\.app\.hdmi(\d)$/.exec(id);
      if (!stats || !id) { sig = null; sigDone = true; return paintInfo(); }
      paintInfo();
      var q = '/api/home/picture?kind=' + (m ? 'input' : 'app') + '&port=' + (m ? m[1] : 0) +
        '&app=' + encodeURIComponent(id) + '&t=' + Date.now();
      http('GET', q, null, function (p) { sig = p && p.ok && p.signal ? p.signal : null; sigDone = true; paintInfo(); });
    });
  }
  // Glasshouse's game reading: here only for the kind of VRR in use (G-SYNC, FreeSync, HDMI VRR).
  function loadFps() {
    http('GET', '/api/game/fps?t=' + Date.now(), null, function (r) { fps = r && r.fps ? r.fps : null; paintInfo(); });
  }
  function buildInfo() {
    var box = document.getElementById('cells');
    CELLS.forEach(function (c) {
      var cell = document.createElement('div'), k = document.createElement('div'), val = document.createElement('div');
      cell.className = 'cell' + (c.wide ? ' wide' : ''); k.className = 'k'; k.textContent = c.label; val.className = 'v none';
      val.textContent = '\u2014';
      cell.appendChild(k); cell.appendChild(val); box.appendChild(cell);
      cellEls[c.id] = val;
    });
  }

  var ctl = DEFS.map(function (d) { return { def: d, row: d.kind === 'link' ? {} : null }; });

  function apply(rows) {
    var by = {};
    rows.forEach(function (r) { by[r.id] = r; });
    ctl.forEach(function (c) { c.row = c.def.kind === 'link' ? {} : (by[c.def.id] || null); });
    if (!visible(sel)) step(1);
    paintAll();
  }

  function load(quiet) {
    // Both sections are asked for at once.
    var pic, game, left = 2;
    function done() {
      if (--left) return;
      if (!pic || !pic.ok) {
        if (!quiet) say('Could not read the TV', 'Glasshouse did not answer. Is it running?', true);
        return;
      }
      loaded = true;
      var rows = pic.rows || [];
      if (game && game.ok) rows = rows.concat(game.rows || []);
      apply(rows);
      try { localStorage.setItem('picture-panel-rows', JSON.stringify(rows)); } catch (e) { /* not kept */ }
      if (!quiet) say('');
      if (ctl[sel].row && ctl[sel].row.active === false) hint();
    }
    http('GET', '/api/lgsettings?section=picture&t=' + Date.now(), null, function (r) { pic = r; done(); });
    http('GET', '/api/lgsettings?section=game&t=' + Date.now(), null, function (g) { game = g; done(); });
  }

  function send(c, value) {
    http('POST', '/api/control', { action: 'lgSetting', value: { id: c.def.id, value: value } }, function (ok, r) {
      if (!ok || (r && r.ok === false)) {
        say('The TV did not accept that', r && r.error ? r.error : '', true);
        load(true);
        return;
      }
      say('');
      // A picture mode brings its own set of every other value with it.
      if (c.def.id === 'pictureMode') setTimeout(function () { load(true); }, 700);
    });
  }

  function change(i, dir) {
    var c = ctl[i];
    if (c.def.kind === 'link') { if (dir > 0) activate(c); return; }
    if (!c.row || !loaded) return;
    if (c.row.active === false) { hint(); return; }
    if (c.def.kind === 'choice') {
      var n = c.row.choices.length, at = choiceAt(c);
      if (!n) return;
      at = (at + dir + n) % n;
      c.row.value = c.row.choices[at].value;
      paint(i);
      send(c, c.row.value);
    } else {
      // Colour temperature is stored warm-negative, but the number shown (Warm 10) goes up
      // to the right, so its arrows are flipped: Left lowers what is shown, Right raises it.
      var v = Math.max(c.row.min, Math.min(c.row.max, c.row.value + (c.def.kind === 'temp' ? -dir : dir)));
      if (v === c.row.value) return;
      c.row.value = v;
      paint(i);
      // A held key changes a number many times a second; the TV hears the last one.
      if (pending[c.def.id]) clearTimeout(pending[c.def.id]);
      pending[c.def.id] = setTimeout(function () { pending[c.def.id] = null; send(c, c.row.value); }, 250);
    }
  }

  // The TV marks a setting inactive when the picture mode or input switches it off
  // (TruMotion in Game mode, for example). Say so, instead of letting a change fail.
  function hint() {
    var c = ctl[sel];
    if (c.def.kind !== 'link' && c.row && c.row.active === false) {
      var mode = ctl[0].row ? text(ctl[0]) : '';
      say(c.def.label, 'Not available' + (mode ? ' in ' + mode + ' mode' : ' right now') + '.', false);
    } else {
      say('');
    }
  }

  function activate(c) {
    if (c.def.action === 'more') { expanded = !expanded; paintAll(); hint(); }
    else openSettings();
  }

  function openSettings() {
    http('POST', '/api/control', { action: 'launchApp', value: 'com.palm.app.settings' }, function (ok, r) {
      if (!ok || (r && r.ok === false)) return say('Could not open Settings', r && r.error ? r.error : '', true);
      setTimeout(leave, 400);
    });
  }

  function build() {
    ctl.forEach(function (c, i) {
      var row = document.createElement('div'), lbl = document.createElement('div'), box = document.createElement('div');
      var left = document.createElement('div'), right = document.createElement('div'), val = document.createElement('div');
      var fill = null;
      row.className = 'row'; lbl.className = 'lbl'; lbl.textContent = c.def.label;
      box.className = 'ctl'; left.className = 'arrow'; right.className = 'arrow'; val.className = 'val';
      left.innerHTML = '&#8249;'; right.innerHTML = '&#8250;';
      if (c.def.kind === 'link') {
        box.appendChild(right);
      } else {
        box.appendChild(left); box.appendChild(val); box.appendChild(right);
      }
      row.appendChild(lbl); row.appendChild(box); rowsEl.appendChild(row);
      els.push({ row: row, val: val, fill: fill, lbl: lbl, arrow: right });
      // Magic Remote pointer: click a row to select it, an arrow to change it.
      row.addEventListener('mousedown', function () { sel = i; paintAll(); hint(); poke(); if (c.def.kind === 'link') activate(c); });
      left.addEventListener('mousedown', function (e) { e.stopPropagation(); sel = i; change(i, -1); paintAll(); poke(); });
      right.addEventListener('mousedown', function (e) { e.stopPropagation(); sel = i; change(i, 1); paintAll(); poke(); });
    });
    paintAll();
  }

  function leave() {
    if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') { try { window.PalmSystem.platformBack(); } catch (e) { /* fall through */ } }
    window.close();
  }
  // A forgotten panel closes itself after a minute without a key or pointer.
  function poke() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(leave, 60000); }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which;
    poke();
    if (k === 38) { step(-1); paintAll(); hint(); }
    else if (k === 40) { step(1); paintAll(); hint(); }
    else if (k === 37) { change(sel, -1); }
    else if (k === 39 || k === 13) { change(sel, 1); }
    else if (k === 461 || k === 27 || k === 8) { leave(); }
    e.preventDefault();
  });

  build();
  buildInfo();
  if (lastInfo) paintInfo();
  // The last values the TV gave are shown at once; changes wait for the TV's own answer (loaded).
  try {
    var saved = JSON.parse(localStorage.getItem('picture-panel-rows') || 'null');
    if (saved && saved.length) { shown = true; apply(saved); }
  } catch (e) { /* nothing kept */ }
  load(false);
  loadInfo();
  setInterval(loadInfo, 3000);
  poke();
})();
</script>
</body>
</html>
