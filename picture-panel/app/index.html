<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Panel</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:'LG Smart UI',sans-serif}
#m{display:none;position:absolute;left:32px;bottom:32px;width:560px;padding:22px 26px;background:rgba(0,0,0,.94);
  outline:1px solid rgba(244,241,234,.16);color:#ece7df;font-size:22px;line-height:1.4}
#m small{display:block;color:#a39d93;font-size:17px;margin-top:6px}
</style>
</head>
<body>
<div id="m">Glasshouse is not answering.<small>The Picture Panel is shown by Glasshouse, which has to be running. Closing.</small></div>
<script>
/*
 * A thin launcher. The panel itself is a page on Glasshouse's server
 * (assets/picture-panel.html), because Glasshouse only accepts changes from
 * pages it serves. This page checks the server is up, then opens it, keeping
 * the overlay window. ES5 only.
 */
(function () {
  var BASE = 'http://localhost:8080';
  function fail() {
    document.getElementById('m').style.display = 'block';
    setTimeout(function () { window.close(); }, 6000);
  }
  var x = new XMLHttpRequest();
  x.open('GET', BASE + '/api/caps?t=' + Date.now(), true);
  x.timeout = 3000;
  x.onload = function () {
    if (x.status >= 200 && x.status < 400) location.replace(BASE + '/assets/picture-panel.html?t=' + Date.now());
    else fail();
  };
  x.onerror = fail;
  x.ontimeout = fail;
  x.send();
})();
</script>
</body>
</html>
