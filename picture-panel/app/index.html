<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Panel</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'LG Smart UI',sans-serif;color:#ece7df;-webkit-font-smoothing:antialiased}
#panel{position:absolute;left:32px;bottom:32px;width:640px;background:rgba(0,0,0,.94);
  outline:1px solid rgba(244,241,234,.16);padding-bottom:12px}
#head{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;
  -webkit-justify-content:space-between;justify-content:space-between;padding:22px 24px 16px}
#head b{font-size:26px;font-weight:600}
#head span{font-size:17px;color:#6b665e}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:space-between;justify-content:space-between;
  height:58px;margin:0 16px 8px;padding:0 8px 0 22px;cursor:default;
  outline:1px solid rgba(244,241,234,.16)}
.row.focus{outline:2px solid #ece7df;background:#141310}
.lbl{font-size:21px;color:#a39d93}
.row.focus .lbl{color:#ece7df}
.ctl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.arrow{width:40px;height:40px;line-height:38px;text-align:center;font-size:24px;color:#3a3732;cursor:pointer}
.row.focus .arrow{color:#ece7df}
.val{min-width:200px;text-align:center;font-size:21px;font-weight:600}
.bar{display:inline-block;vertical-align:middle;width:110px;height:4px;background:#2a2825;margin-right:14px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#a39d93}
.row.focus .bar i{background:#ece7df}
#foot{padding:6px 24px 8px;font-size:16px;color:#6b665e}
</style>
</head>
<body>
<div id="panel">
  <div id="head"><b>Picture</b><span>Preview only. Not connected to the TV.</span></div>
  <div id="rows"></div>
  <div id="foot">Up and Down move &middot; Left and Right change &middot; Back closes &middot; Last key: <span id="key">none yet</span></div>
</div>
<script>
/*
 * A display-only picture panel, shown as an overlay window. The values are
 * sample values that change here only; nothing is sent to the TV. ES5 only.
 */
(function () {
  var CONTROLS = [
    { label: 'Picture Mode', opts: ['Vivid', 'Standard', 'Eco', 'Cinema', 'Sports', 'Game Optimizer', 'Filmmaker Mode', 'Expert (Bright Room)', 'Expert (Dark Room)'], at: 6 },
    { label: 'OLED Pixel Brightness', range: [0, 100, 5], at: 80 },
    { label: 'Black Level', opts: ['Auto', 'Low', 'High'], at: 0 },
    { label: 'Auto Dynamic Contrast', opts: ['Off', 'Low', 'Medium', 'High'], at: 0 },
    { label: 'Peak Brightness', opts: ['Off', 'Low', 'Medium', 'High'], at: 3 },
    { label: 'Color Temperature', opts: ['Cool', 'Medium', 'Warm 1', 'Warm 2', 'Warm 3'], at: 2 },
    { label: 'TruMotion', opts: ['Off', 'Natural', 'Smooth', 'Clear', 'User'], at: 0 }
  ];
  var sel = 0, idleTimer = null;
  var rowsEl = document.getElementById('rows');
  var keyEl = document.getElementById('key');
  var els = [];

  function text(c) { return c.range ? String(c.at) : c.opts[c.at]; }

  function paint(i) {
    var c = CONTROLS[i], e = els[i];
    e.row.className = 'row' + (i === sel ? ' focus' : '');
    e.val.textContent = text(c);
    if (c.range) e.fill.style.width = (100 * (c.at - c.range[0]) / (c.range[1] - c.range[0])) + '%';
  }
  function paintAll() { for (var i = 0; i < CONTROLS.length; i++) paint(i); }

  function change(i, dir) {
    var c = CONTROLS[i];
    if (c.range) c.at = Math.max(c.range[0], Math.min(c.range[1], c.at + dir * c.range[2]));
    else c.at = (c.at + dir + c.opts.length) % c.opts.length;
    paint(i);
  }

  function build() {
    CONTROLS.forEach(function (c, i) {
      var row = document.createElement('div'), lbl = document.createElement('div'), ctl = document.createElement('div');
      var left = document.createElement('div'), right = document.createElement('div'), val = document.createElement('div');
      var fill = null;
      row.className = 'row'; lbl.className = 'lbl'; lbl.textContent = c.label;
      ctl.className = 'ctl'; left.className = 'arrow'; right.className = 'arrow'; val.className = 'val';
      left.innerHTML = '&#8249;'; right.innerHTML = '&#8250;';
      if (c.range) {
        var bar = document.createElement('span'); bar.className = 'bar';
        fill = document.createElement('i'); bar.appendChild(fill);
        ctl.appendChild(left); ctl.appendChild(bar); ctl.appendChild(val); ctl.appendChild(right);
        val.style.minWidth = '60px';
      } else {
        ctl.appendChild(left); ctl.appendChild(val); ctl.appendChild(right);
      }
      row.appendChild(lbl); row.appendChild(ctl); rowsEl.appendChild(row);
      els.push({ row: row, val: val, fill: fill });
      // Magic Remote pointer: click a row to select it, click an arrow to change it.
      row.addEventListener('mousedown', function () { sel = i; paintAll(); poke(); });
      left.addEventListener('mousedown', function (e) { e.stopPropagation(); sel = i; change(i, -1); paintAll(); poke(); });
      right.addEventListener('mousedown', function (e) { e.stopPropagation(); sel = i; change(i, 1); paintAll(); poke(); });
    });
    paintAll();
  }

  function leave() {
    if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') { try { window.PalmSystem.platformBack(); } catch (e) { /* fall through */ } }
    window.close();
  }
  // A forgotten panel closes itself after two minutes without a key or pointer.
  function poke() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(leave, 120000); }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which;
    keyEl.textContent = k;
    poke();
    if (k === 38) { if (sel > 0) sel--; paintAll(); }
    else if (k === 40) { if (sel < CONTROLS.length - 1) sel++; paintAll(); }
    else if (k === 37) { change(sel, -1); }
    else if (k === 39 || k === 13) { change(sel, 1); }
    else if (k === 461 || k === 27 || k === 8) { leave(); }
    e.preventDefault();
  });

  build();
  poke();
})();
</script>
</body>
</html>
