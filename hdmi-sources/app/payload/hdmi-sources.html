<!doctype html>
<!-- hdmi-sources @VERSION@ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HDMI Sources</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'LG Smart UI',sans-serif;color:#ece7df;-webkit-font-smoothing:antialiased}
#row{position:absolute;left:32px;bottom:32px;display:-webkit-flex;display:flex}
/* Home's input tile, in Spotlight View's form: 384x216, square, the subtle outline, 16px apart. */
.tile{width:384px;height:216px;box-sizing:border-box;margin-right:16px;padding:16px 20px 18px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-justify-content:space-between;justify-content:space-between;
  background:rgba(0,0,0,.95);outline:1px solid rgba(244,241,234,.16);cursor:default}
/* Unselected tiles are dimmed as in Home, but only their contents: dimming the whole tile
   would dim the outline too, to nearly nothing over black. */
.tile .dhead,.tile .st{opacity:.8}
.tile.focus{background:#141310;outline:2px solid #ece7df}
.tile.focus .dhead,.tile.focus .st{opacity:1}
.dhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-width:0}
.dtx{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.dico{-webkit-flex:0 0 auto;flex:0 0 auto;width:56px;height:56px;margin-right:18px;color:#ece7df;font-style:normal}
.dico svg{display:block;width:100%;height:100%}
.nm{font-size:30px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{font-size:20px;color:#a39d93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:19px;color:#6b665e;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.st em{font-style:normal}
.tile.last .st em{color:#e9ad55}
.tile.last .st em:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e9ad55;margin-right:10px;vertical-align:2px}
/* Nothing connected, or an input that would not open. */
#msg{display:none;position:absolute;left:32px;bottom:32px;width:560px;padding:22px 26px;background:rgba(0,0,0,.95);
  outline:1px solid rgba(244,241,234,.16);line-height:1.4}
#msg.show{display:block}
#msg.err{outline-color:#e9ad55}
#msg b{display:block;font-size:24px;font-weight:600}
#msg span{display:block;font-size:19px;color:#a39d93;margin-top:4px}
</style>
</head>
<body>
<div id="row"></div>
<div id="msg"><b id="mt"></b><span id="mx"></span></div>
<script src="/assets/devicons.js"></script>
<script>
/*
 * The connected HDMI sources, drawn as Glasshouse Home draws its input tiles (the same
 * icons, from devicons.js, and the same name, path, status and CEC lines), in the Spotlight
 * View form. Served by Glasshouse so it may open an input through /api/home/open, the call
 * Home itself makes. A source counts as connected when something answers on its port: a CEC
 * device, a live signal, or it is the input on screen. ES5 only.
 */
(function () {
  var sel = 0, list = [], idleTimer = null, busy = false;
  var rowEl = document.getElementById('row'), msgEl = document.getElementById('msg');
  var els = [];

  function http(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 12000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
      cb(x.status >= 200 && x.status < 300 ? r : null, r);
    };
    x.ontimeout = function () { cb(null, null); };
    x.send(body ? JSON.stringify(body) : null);
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function say(title, text, bad) {
    if (!title) { msgEl.className = ''; return; }
    document.getElementById('mt').textContent = title;
    document.getElementById('mx').textContent = text || '';
    msgEl.className = bad ? 'show err' : 'show';
  }

  function isLast(d, now) {
    return !!(now && now.kind === 'input' && now.port === d.port && (!now.devices || now.devices.indexOf(d.id) !== -1));
  }

  // The tile, as Home builds it: icon, name and path above, status and CEC address below.
  function tileHtml(d, last) {
    var path = d.via ? 'HDMI ' + d.port + ', through ' + d.via : 'HDMI ' + d.port;
    var icon = window.glasshouseDevIcon ? window.glasshouseDevIcon(d) : '';
    return '<div class="dhead">' + icon + '<div class="dtx"><div class="nm">' + esc(d.name) + '</div><div class="path">' + esc(path) + '</div></div></div>' +
      '<div class="st"><em>' + (last ? 'Currently active' : 'Connected') + '</em><span>' + (d.address ? esc('CEC ' + d.address) : '') + '</span></div>';
  }

  function paint() {
    for (var i = 0; i < els.length; i++) els[i].className = 'tile' + (list[i].last ? ' last' : '') + (i === sel ? ' focus' : '');
  }

  function show(next) {
    var keep = list[sel] ? list[sel].id : null;
    list = next;
    rowEl.innerHTML = '';
    els = [];
    list.forEach(function (d, i) {
      var el = document.createElement('div');
      el.innerHTML = tileHtml(d, d.last);
      el.className = 'tile';
      // Magic Remote pointer: moving onto a tile selects it, clicking opens it.
      el.addEventListener('mouseenter', function () { sel = i; paint(); poke(); });
      el.addEventListener('click', function () { sel = i; paint(); openSource(); });
      rowEl.appendChild(el);
      els.push(el);
    });
    var at = -1, i;
    for (i = 0; i < list.length; i++) if (list[i].id === keep) at = i;
    if (at < 0) for (i = 0; i < list.length; i++) if (list[i].last) at = i;
    sel = at < 0 ? 0 : at;
    if (!list.length) say('Nothing connected', 'No HDMI input has a device or a signal.', false); else say('');
    paint();
  }

  var first = true;
  function load() {
    http('GET', '/api/home/catalogue?t=' + Date.now(), null, function (c) {
      if (!c || !c.devices) {
        if (first) say('Could not read the TV', 'Glasshouse did not answer. Is it running?', true);
        return;
      }
      http('GET', '/api/home/now?t=' + Date.now(), null, function (now) {
        var devs = c.devices.filter(function (d) { return !d.tuner && !d.unused && d.port >= 1 && d.port <= 4; });
        var signal = {}, pending = devs.length;
        function done() {
          var out = [];
          devs.forEach(function (d) {
            var last = isLast(d, now);
            if (d.address || signal[d.port] || last) { d.last = last; out.push(d); }
          });
          // On first load the selection starts on the source in use; later reads keep it where it is.
          if (first) sel = 0;
          first = false;
          show(out);
        }
        if (!pending) return done();
        devs.forEach(function (d) {
          http('GET', '/api/home/signal?port=' + d.port + '&t=' + Date.now(), null, function (r) {
            signal[d.port] = !!(r && r.signal);
            if (--pending === 0) done();
          });
        });
      });
    });
  }

  function openSource() {
    var d = list[sel];
    if (!d || busy) return;
    busy = true;
    http('POST', '/api/home/open', { kind: 'dev', id: d.id }, function (ok, r) {
      busy = false;
      if (!ok || (r && r.ok === false)) return say('That did not open', r && r.error ? r.error : '', true);
      setTimeout(leave, 300);
    });
  }

  function leave() {
    if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') { try { window.PalmSystem.platformBack(); } catch (e) { /* fall through */ } }
    window.close();
  }
  // A forgotten panel closes itself after a minute without a key or pointer.
  function poke() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(leave, 60000); }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which, n = list.length;
    poke();
    if (k === 37 && n) { sel = (sel + n - 1) % n; paint(); }
    else if (k === 39 && n) { sel = (sel + 1) % n; paint(); }
    else if (k === 13) { openSource(); }
    else if (k === 461 || k === 27 || k === 8) { leave(); }
    e.preventDefault();
  });

  load();
  setInterval(load, 5000);
  poke();
})();
</script>
</body>
</html>
