<!doctype html>
<!-- hdmi-sources @VERSION@ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HDMI Sources</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'LG Smart UI',sans-serif;color:#ece7df;-webkit-font-smoothing:antialiased}
#row{position:absolute;left:32px;bottom:32px;display:-webkit-flex;display:flex}
/* Home's input tile in Spotlight View's form (square, the subtle outline, 16px apart), made smaller: no
   status row and no more width than the name needs, so 320x112. The active source has a dot at the right. */
.tile{position:relative;width:320px;height:112px;box-sizing:border-box;margin-right:16px;padding:20px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-justify-content:center;justify-content:center;
  background:rgba(0,0,0,.9);outline:1px solid rgba(244,241,234,.2);cursor:default}
/* Unselected tiles are dimmed as in Home, but only their contents: dimming the whole tile
   would dim the outline too, to nearly nothing over black. */
.tile .dhead{opacity:.8}
.tile.focus{background:#141310;outline:2px solid #ece7df}
.tile.focus .dhead{opacity:1}
.dhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-width:0}
.dtx{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.dico{-webkit-flex:0 0 auto;flex:0 0 auto;width:56px;height:56px;margin-right:18px;color:#ece7df;font-style:normal}
.dico svg{display:block;width:100%;height:100%}
.nm{font-size:26px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{font-size:20px;color:#a39d93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;right:20px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:#e9ad55}
.tile.last .dhead{padding-right:22px}
/* Home is only a square with its icon. */
.tile.home{width:112px;padding:0;-webkit-align-items:center;align-items:center}
.tile.home .dico{margin-right:0}
/* Nothing connected, or an input that would not open. */
#msg{display:none;position:absolute;left:32px;bottom:32px;width:560px;padding:22px 26px;background:rgba(0,0,0,.9);
  outline:1px solid rgba(244,241,234,.2);line-height:1.4}
#msg.show{display:block}
#msg.err{outline-color:#e9ad55}
#msg b{display:block;font-size:24px;font-weight:600}
#msg span{display:block;font-size:19px;color:#a39d93;margin-top:4px}
</style>
</head>
<body>
<div id="row"></div>
<div id="msg"><b id="mt"></b><span id="mx"></span></div>
<script src="/assets/devicons.js"></script>
<script>
/*
 * The connected HDMI sources, drawn as Glasshouse Home draws its input tiles (the same
 * icons, from devicons.js, and the same name, path, status and CEC lines), in the Spotlight
 * View form. Served by Glasshouse so it may open an input through /api/home/open, the call
 * Home itself makes. A source counts as connected when something answers on its port: a CEC
 * device, a live signal, or it is the input on screen. ES5 only.
 */
(function () {
  var sel = 0, list = [], idleTimer = null, busy = false;
  var rowEl = document.getElementById('row'), msgEl = document.getElementById('msg');
  var els = [];

  function http(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 12000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
      cb(x.status >= 200 && x.status < 300 ? r : null, r);
    };
    x.ontimeout = function () { cb(null, null); };
    x.send(body ? JSON.stringify(body) : null);
  }
  // Glasshouse knows only the last input, not a history, so the panel keeps its own: when each tile was last
  // on screen (read from Glasshouse's "now") or opened from here. Kept in the page's own storage.
  var KEY = 'hdmi-sources-used', used = {};
  try { used = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { used = {}; }
  function record(id, ts) {
    if (!(ts > (used[id] || 0))) return;
    used[id] = ts;
    try { localStorage.setItem(KEY, JSON.stringify(used)); } catch (e) { /* not kept */ }
  }
  // A port's name is kept when it has a real one (a CEC device), and stands in when the TV gives none or only "HDMI 3".
  var NKEY = 'hdmi-sources-names', names = {};
  try { names = JSON.parse(localStorage.getItem(NKEY) || '{}') || {}; } catch (e) { names = {}; }
  function remember(d) {
    var plain = !d.name || /^HDMI\s*\d+$/i.test(String(d.name));
    if (!plain) {
      if (names[d.port] !== d.name) { names[d.port] = d.name; try { localStorage.setItem(NKEY, JSON.stringify(names)); } catch (e) { /* not kept */ } }
    } else if (names[d.port]) d.name = names[d.port];
    else if (!d.name) d.name = 'HDMI ' + d.port;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function say(title, text, bad) {
    if (!title) { msgEl.className = ''; return; }
    document.getElementById('mt').textContent = title;
    document.getElementById('mx').textContent = text || '';
    msgEl.className = bad ? 'show err' : 'show';
  }

  // The Home tile: the same tile as a source, with a house icon in the icons' own line style.
  var HOME_ICON = '<i class="dico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5.5h4V20"/></svg></i>';

  function isLast(d, now) {
    return !!(now && now.kind === 'input' && now.port === d.port && (!now.devices || now.devices.indexOf(d.id) !== -1));
  }

  // The tile, as Home builds it: icon, name and path above, status and CEC address below.
  function tileHtml(d, last) {
    var icon, name, path;
    if (d.home) return '<div class="dhead">' + HOME_ICON + '</div>';
    else {
      icon = window.glasshouseDevIcon ? window.glasshouseDevIcon(d) : '';
      name = d.name;
      path = !d.on ? 'Inactive' : d.via ? 'HDMI ' + d.port + ', through ' + d.via : (d.name === 'HDMI ' + d.port ? '' : 'HDMI ' + d.port);
    }
    return '<div class="dhead">' + icon + '<div class="dtx"><div class="nm">' + esc(name) + '</div><div class="path">' + esc(path) +
      '</div></div></div>' + (last ? '<span class="dot"></span>' : '');
  }

  function paint() {
    for (var i = 0; i < els.length; i++) els[i].className = 'tile' + (list[i].last ? ' last' : '') + (list[i].home ? ' home' : '') + (i === sel ? ' focus' : '');
  }

  function show(next) {
    var keep = list[sel] ? list[sel].id : null;
    list = next;
    rowEl.innerHTML = '';
    els = [];
    list.forEach(function (d, i) {
      var el = document.createElement('div');
      el.innerHTML = tileHtml(d, d.last);
      el.className = 'tile' + (d.home ? ' home' : '');
      // Magic Remote pointer: moving onto a tile selects it, clicking opens it.
      el.addEventListener('mouseenter', function () { sel = i; paint(); poke(); });
      el.addEventListener('click', function () { sel = i; paint(); openSource(); });
      rowEl.appendChild(el);
      els.push(el);
    });
    var at = -1, i;
    for (i = 0; i < list.length; i++) if (list[i].id === keep) at = i;
    if (at < 0) for (i = 0; i < list.length; i++) if (list[i].last) at = i;
    sel = at < 0 ? 0 : at;
    if (!list.length) say('Nothing connected', 'No HDMI input has a device or a signal.', false); else say('');
    paint();
  }

  var first = true;
  function load() {
    http('GET', '/api/home/catalogue?t=' + Date.now(), null, function (c) {
      if (!c || !c.devices) {
        if (first) say('Could not read the TV', 'Glasshouse did not answer. Is it running?', true);
        return;
      }
      http('GET', '/api/home/now?t=' + Date.now(), null, function (now) {
        var devs = c.devices.filter(function (d) { return !d.tuner && d.port >= 1 && d.port <= 4; });
        var signal = {}, pending = devs.length;
        function done() {
          var out = [];
          devs.forEach(function (d) {
            remember(d);
            d.last = isLast(d, now);
            // Connected when something answers on the port: a CEC device, a live signal, or it is on screen.
            d.on = !!(d.address || signal[d.port] || d.last);
            if (d.last && now.since) record(d.id, now.since);
            out.push(d);
          });
          // Home is always first; the ports follow, most recently used first, the never-used in port order.
          var rank = out.map(function (d, n) { return { d: d, n: n }; });
          rank.sort(function (a, b) { return ((used[b.d.id] || 0) - (used[a.d.id] || 0)) || (a.n - b.n); });
          first = false;
          show([{ home: true, id: 'home', name: 'Home' }].concat(rank.map(function (r) { return r.d; })));
        }
        if (!pending) return done();
        devs.forEach(function (d) {
          http('GET', '/api/home/signal?port=' + d.port + '&t=' + Date.now(), null, function (r) {
            signal[d.port] = !!(r && r.signal);
            if (--pending === 0) done();
          });
        });
      });
    });
  }

  function openSource() {
    var d = list[sel];
    if (!d || busy) return;
    busy = true;
    // Home opens the TV's Home screen; a source opens its input, as Home itself does.
    record(d.id, Date.now());
    var url = d.home ? '/api/control' : '/api/home/open';
    var body = d.home ? { action: 'launchApp', value: 'com.webos.app.home' } : { kind: 'dev', id: d.id };
    http('POST', url, body, function (ok, r) {
      busy = false;
      if (!ok || (r && r.ok === false)) return say('That did not open', r && r.error ? r.error : '', true);
      setTimeout(leave, 300);
    });
  }

  function leave() {
    if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') { try { window.PalmSystem.platformBack(); } catch (e) { /* fall through */ } }
    window.close();
  }
  // A forgotten panel closes itself after a minute without a key or pointer.
  function poke() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(leave, 60000); }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which, n = list.length;
    poke();
    if (k === 37 && n) { sel = (sel + n - 1) % n; paint(); }
    else if (k === 39 && n) { sel = (sel + 1) % n; paint(); }
    else if (k === 13) { openSource(); }
    else if (k === 461 || k === 27 || k === 8) { leave(); }
    e.preventDefault();
  });

  load();
  setInterval(load, 5000);
  // Put in the background (another app opened, or Home), it closes, so it does not stay loaded.
  // Only its own window: a "back" from a hidden page would reach the app on screen.
  document.addEventListener('visibilitychange', function () { if (document.hidden) window.close(); });
  poke();
})();
</script>
</body>
</html>
